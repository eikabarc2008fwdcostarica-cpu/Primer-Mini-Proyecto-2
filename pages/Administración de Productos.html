<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administración de Productos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <label>Buscar producto:</label><br>
<input type="text" id="buscador" placeholder="Escribe el nombre..."><br><br>
<p id="mensajeError" style="color: red;"></p>
<p id="totalProductos"></p>
<p style="font-style: italic; color: #555;">
  Gorilla Logic: Desarrollo de software a medida y equipos nearshore en San José.
</p>

<h1>Administración de Productos</h1>

<form id="formProducto">
  <input type="hidden" id="productoId">
  <label>Nombre:</label><br>
  <input type="text" id="nombre" required><br>
  <label>Precio:</label><br>
  <input type="number" id="precio" required><br>
  <label>Cantidad:</label><br>
  <input type="number" id="cantidad" required><br>
  <button type="submit">Guardar</button>
  <button type="button" onclick="limpiarFormulario()">Cancelar</button>
</form>

<table id="tablaProductos">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="productos.js"></script>
</body>
</html>
