<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gorilla Logic | Acceso</title>
<link rel="stylesheet" href="../src/styles/Login (Autenticación).css">
</head>
<body>

  <section id="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo-badge">GL</div>
        <h1>Gorilla<span>Logic</span></h1>
        <p class="subtitle">Panel de acceso corporativo</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Iniciar sesión</button>
        <button type="button" class="auth-tab" id="tab-register">Crear cuenta</button>
      </div>

      <!-- ==================== FORM: LOGIN ==================== -->
      <form id="login-form" class="auth-panel active" novalidate>
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><path d="M20 21c0-3.9-3.58-7-8-7s-8 3.1-8 7"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Mostrar contraseña">
              <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="error-message" class="alert-message alert-error" role="alert"></div>

        <button type="submit" class="btn-primary" id="login-btn">
          <span>Iniciar sesión</span>
        </button>
      </form>

      <!-- ==================== FORM: REGISTRO ==================== -->
      <form id="register-form" class="auth-panel" novalidate>
        <div class="form-group">
          <label for="reg-name">Nombre completo</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><path d="M20 21c0-3.9-3.58-7-8-7s-8 3.1-8 7"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="reg-name" name="reg-name" placeholder="Nombre y apellido" autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-username">Usuario</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><circle cx="7.5" cy="6.5" r=".6" fill="currentColor" stroke="none"/></svg>
            <input type="text" id="reg-username" name="reg-username" placeholder="Elige un nombre de usuario" autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
            <input type="password" id="reg-password" name="reg-password" placeholder="Crea una contraseña" autocomplete="new-password">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password-confirm">Confirmar contraseña</label>
          <div class="input-wrapper">
            <svg class="field-icon" viewBox="0 0 24 24"><path d="M9 12.5 11 15l4.5-5"/><circle cx="12" cy="12" r="9.5"/></svg>
            <input type="password" id="reg-password-confirm" name="reg-password-confirm" placeholder="Repite la contraseña" autocomplete="new-password">
          </div>
        </div>

        <div id="register-error" class="alert-message alert-error" role="alert"></div>
        <div id="register-success" class="alert-message alert-success" role="status"></div>

        <button type="submit" class="btn-primary" id="register-btn">
          <span>Crear cuenta</span>
        </button>
      </form>

    </div>
  </section>

  <script src="../src/js/Login (Autenticación).js"></script>
</body>
</html>
